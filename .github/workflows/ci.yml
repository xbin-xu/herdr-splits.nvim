name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Bash syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: make check-shell

  # The Herdr-side helper is what every keypress runs, on all three platforms.
  # It has no dependencies, so this needs no vendoring or registry access.
  rust:
    name: Rust helper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - run: cargo build --release --locked --manifest-path rust/Cargo.toml
      # Prove the installed artifact really runs the way the manifest calls it:
      # a relative, extensionless path from the plugin root.
      - name: Install and run the helper as the manifest does
        shell: bash
        run: |
          cargo run --release --locked --quiet --manifest-path rust/Cargo.toml -- install
          test -f scripts/bin/herdr-splits
          ./scripts/bin/herdr-splits --version
      - name: Probe the wire protocol without a server
        shell: bash
        run: |
          printf '%s\n' \
            '{"method":"pane.get","response":{"result":{"pane":{"tokens":{"editor":"nvim"}}}}}' \
            '{"method":"pane.send_keys","response":{"result":{}}}' > /tmp/fixture.jsonl
          HERDR_PANE_ID=A ./scripts/bin/herdr-splits nav left \
            --replay /tmp/fixture.jsonl --trace /tmp/trace.log
          test "$(cut -f1 /tmp/trace.log | tr '\n' ' ')" = "pane.get pane.send_keys "

  test:
    name: Neovim ${{ matrix.neovim-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        neovim-version: [v0.10.0, stable]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: true
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.neovim-version }}
      - run: make test
