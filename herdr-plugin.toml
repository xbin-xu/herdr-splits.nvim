id = "herdr-splits"
name = "Herdr Splits"
version = "0.6.0"
min_herdr_version = "0.8.0"
description = "Seamless navigation between Herdr panes and Neovim/Vim splits, with native Neovim resizing"
platforms = ["linux", "macos", "windows"]

# Herdr-side navigation actions. These check if the focused pane is running an
# editor (Neovim token or Vim title marker) and either forward the key chord or
# move Herdr pane focus.
# Bind them in ~/.config/herdr/config.toml:
#   [[keys.command]]
#   key = "ctrl+h"
#   type = "plugin_action"
#   command = "herdr-splits.nav-left"
#
# The actions run the Rust helper built from `rust/`. It talks to the control
# socket directly (no `herdr` CLI subprocesses), which is what keeps a keypress
# at ~10 ms on Windows instead of the ~50 ms a `python -S` start-up costs.
#
# `scripts/bin/herdr-splits` deliberately has no extension on any platform:
# herdr resolves a relative command against the plugin root and canonicalises
# it, and Windows then runs that exact path without appending PATHEXT variants.
# An extensionless executable works there; `herdr-splits.exe` would not.
#
# `herdr plugin link` does not run build commands, so after linking a local
# checkout build the helper yourself:
#   cargo build --release --manifest-path rust/Cargo.toml
#   cargo run --release --manifest-path rust/Cargo.toml -- install

[[build]]
command = ["cargo", "build", "--release", "--locked", "--manifest-path", "rust/Cargo.toml"]

[[build]]
command = ["cargo", "run", "--release", "--locked", "--quiet", "--manifest-path", "rust/Cargo.toml", "--", "install"]

[[actions]]
id = "nav-left"
title = "Navigate left (editor/Herdr)"
contexts = ["global"]
command = ["scripts/bin/herdr-splits", "nav", "left"]

[[actions]]
id = "nav-down"
title = "Navigate down (editor/Herdr)"
contexts = ["global"]
command = ["scripts/bin/herdr-splits", "nav", "down"]

[[actions]]
id = "nav-up"
title = "Navigate up (editor/Herdr)"
contexts = ["global"]
command = ["scripts/bin/herdr-splits", "nav", "up"]

[[actions]]
id = "nav-right"
title = "Navigate right (editor/Herdr)"
contexts = ["global"]
command = ["scripts/bin/herdr-splits", "nav", "right"]

[[actions]]
id = "resize-left"
title = "Resize left (Neovim/Herder)"
contexts = ["global"]
command = ["scripts/bin/herdr-splits", "resize", "left"]

[[actions]]
id = "resize-down"
title = "Resize down (Neovim/Herder)"
contexts = ["global"]
command = ["scripts/bin/herdr-splits", "resize", "down"]

[[actions]]
id = "resize-up"
title = "Resize up (Neovim/Herder)"
contexts = ["global"]
command = ["scripts/bin/herdr-splits", "resize", "up"]

[[actions]]
id = "resize-right"
title = "Resize right (Neovim/Herder)"
contexts = ["global"]
command = ["scripts/bin/herdr-splits", "resize", "right"]
